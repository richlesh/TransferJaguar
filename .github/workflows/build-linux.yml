name: Build and Release Linux

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version tag (e.g. 1.0.0)"
        required: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The @napi-rs/keyring native binding ships as per-platform prebuilt
      # packages (optional deps). The runner is x64, so `npm ci` only fetches the
      # x64 binary; the arm64 .deb/.rpm would then crash at launch with
      # "Cannot find native binding" (npm optional-deps bug npm/cli#4828).
      # Force-fetch the binary matching the target arch so it gets bundled.
      - name: Ensure keyring native binding for target arch
        run: |
          KR_VERSION=$(node -p "require('@napi-rs/keyring/package.json').version")
          npm install --no-save --force --os=linux --cpu=${{ matrix.arch }} --libc=glibc "@napi-rs/keyring-linux-${{ matrix.arch }}-gnu@${KR_VERSION}"

      # Rollup (pulled in by Vite) also ships its native parser as per-platform
      # optional deps, hit by the same npm bug (npm/cli#4828) so `npm ci` can skip
      # it and `vite build` fails with "Cannot find module @rollup/rollup-linux-x64-gnu".
      # The renderer build runs on the x64 runner itself, so always fetch the x64 binary.
      - name: Ensure Rollup native binding for the runner
        run: |
          RU_VERSION=$(node -p "require('rollup/package.json').version")
          npm install --no-save --force --os=linux --cpu=x64 --libc=glibc "@rollup/rollup-linux-x64-gnu@${RU_VERSION}"

      - name: Install ARM64 cross-compilation tools
        if: matrix.arch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Inject license salt
        run: |
          echo "const LICENSE_SALT = \"${{ secrets.LICENSE_SALT }}\";" > license.cjs
          echo "module.exports = { LICENSE_SALT };" >> license.cjs

      - name: Build renderer + main
        run: npm run build

      - name: Inject OAuth credentials
        env:
          DROPBOX_CLIENT_ID: ${{ secrets.DROPBOX_CLIENT_ID }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: node scripts/inject-oauth.mjs

      - name: Build Linux ${{ matrix.arch }}
        run: ./node_modules/.bin/electron-builder --linux --${{ matrix.arch }} --publish never

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: TransferJaguar ${{ inputs.tag || github.ref_name }}
          draft: true
          files: |
            dist/*.deb
            dist/*.rpm
