name: Build and Release Windows

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version tag (e.g. 1.0.0)"
        required: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: write
    strategy:
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The @napi-rs/keyring native binding ships as per-platform prebuilt
      # packages (optional deps). The runner is x64, so `npm ci` only fetches the
      # x64 binary; the arm64 installer would then crash at launch with
      # "Cannot find native binding" (npm optional-deps bug npm/cli#4828).
      # Force-fetch the binary matching the target arch so it gets bundled.
      - name: Ensure keyring native binding for target arch
        shell: pwsh
        run: |
          $krVersion = node -p "require('@napi-rs/keyring/package.json').version"
          # Fetch the target-arch prebuilt (--force bypasses npm's host EBADPLATFORM check).
          npm install --no-save --force --os=win32 --cpu=${{ matrix.arch }} "@napi-rs/keyring-win32-${{ matrix.arch }}-msvc@$krVersion"
          # Copy the .node into the base @napi-rs/keyring package under the exact
          # filename its loader tries FIRST (require('./keyring.win32-<arch>-msvc.node')).
          # The base package is a real, locked dependency that always gets bundled and
          # unpacked, so the binary can't be dropped by electron-builder's optional-dep
          # pruning the way a separate platform package can (npm/cli#4828 fallout).
          $arch = "${{ matrix.arch }}"
          Copy-Item "node_modules/@napi-rs/keyring-win32-$arch-msvc/keyring.win32-$arch-msvc.node" `
                    "node_modules/@napi-rs/keyring/keyring.win32-$arch-msvc.node"
          if (-not (Test-Path "node_modules/@napi-rs/keyring/keyring.win32-$arch-msvc.node")) { exit 1 }

      # Rollup (pulled in by Vite) also ships its native parser as per-platform
      # optional deps, hit by the same npm bug (npm/cli#4828) so `npm ci` can skip
      # it and `vite build` fails with "Cannot find module @rollup/rollup-win32-x64-msvc".
      # The renderer build runs on the x64 runner itself, so always fetch the x64 binary.
      - name: Ensure Rollup native binding for the runner
        shell: pwsh
        run: |
          $ruVersion = node -p "require('rollup/package.json').version"
          npm install --no-save --force --os=win32 --cpu=x64 "@rollup/rollup-win32-x64-msvc@$ruVersion"

      - name: Inject license salt
        run: |
          @"
          const LICENSE_SALT = "${{ secrets.LICENSE_SALT }}";
          module.exports = { LICENSE_SALT };
          "@ | Set-Content license.cjs
        shell: powershell

      - name: Build renderer + main
        run: npm run build

      - name: Inject OAuth credentials
        env:
          DROPBOX_CLIENT_ID: ${{ secrets.DROPBOX_CLIENT_ID }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: node scripts/inject-oauth.mjs

      - name: Clear electron-builder NSIS cache
        # Works around intermittent "Plugin not found" errors from a corrupted
        # NSIS toolchain in the electron-builder cache; forces a clean re-download.
        shell: pwsh
        run: |
          $cache = Join-Path $env:LOCALAPPDATA "electron-builder\Cache\nsis"
          if (Test-Path $cache) { Remove-Item -Recurse -Force $cache }

      - name: Build Windows ${{ matrix.arch }} installer
        run: ./node_modules/.bin/electron-builder --win --${{ matrix.arch }} --publish never

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign installer with Azure Artifact Signing
        uses: azure/artifact-signing-action@v1
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload installer to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: TransferJaguar ${{ inputs.tag || github.ref_name }}
          draft: true
          files: dist/*.exe
